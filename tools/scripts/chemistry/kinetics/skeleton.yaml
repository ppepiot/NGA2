reactions:
- equation: 2 O + M <=> O2 + M   # one reaction, so the module has a rate to evaluate
  type: three-body
  rate-constant: {A: 1.2e+17, b: -1.0, Ea: 0.0}
  efficiencies: {N2: 1.0, O2: 1.0}
